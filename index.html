  @media (prefers-color-scheme: dark) {
    :root { --primary:#64B5F6; --primary-light:#0D2A44; --text:#F3F4F6; --text2:#C9CED6; --text3:#8B93A1; --border:#2A2F3A; --bg:#0F1218; --card:#171B23; }

  section p { margin:0; color:var(--text2); white-space:pre-line; font-size:15px; }
  .hero { padding:56px 0 24px; }
  .hero h1 { font-size:34px; color:var(--primary); }
  .hero p { color:var(--text2); font-size:17px; margin:8px 0 0; }
  .links { display:grid; gap:12px; margin-top:28px; }
  .links a { display:block; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; color:var(--text); text-decoration:none; font-weight:700; }
  .links a span { display:block; font-weight:400; color:var(--text3); font-size:14px; }
  .links a:hover { border-color:var(--primary); }
  footer { color:var(--text3); font-size:13px; padding:24px 0 40px; }
